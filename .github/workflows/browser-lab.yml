name: browser-lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-boreal-browser:
    runs-on: [self-hosted, Windows, X64, changedesk-lab]
    environment: changedesk-browser-lab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require the pre-provisioned isolated Atlas/Boreal lab and run browser E2E
        run: node scripts/verify-ci.mjs --lane browser
