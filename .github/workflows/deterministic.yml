name: deterministic

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-core-laws:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the untrusted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install the pinned package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          run_install: false
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run deterministic contract, core and law gates
        run: node scripts/verify-ci.mjs

  build-unit-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build all four source workspaces
        run: node scripts/verify-ci.mjs --lane build
      - name: Run SDK, service runtime and Medusa bridge unit suites
        run: node scripts/verify-ci.mjs --lane unit
      - name: Run storefront, planner and backend security functional suites
        run: node scripts/verify-ci.mjs --lane functional
      - name: Verify exact dependency versions and licenses
        run: node scripts/verify-ci.mjs --lane inventory

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure ephemeral database credentials
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$(openssl rand -hex 24)"
          migrator="$(openssl rand -hex 24)"
          runtime="$(openssl rand -hex 24)"
          worker="$(openssl rand -hex 24)"
          atlas="$(openssl rand -hex 24)"
          boreal="$(openssl rand -hex 24)"
          database="changedesk_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          for secret in "$bootstrap" "$migrator" "$runtime" "$worker" "$atlas" "$boreal"; do echo "::add-mask::$secret"; done
          {
            echo "POSTGRES_BOOTSTRAP_PASSWORD=$bootstrap"
            echo "CHANGEDESK_MIGRATOR_PASSWORD=$migrator"
            echo "CHANGEDESK_RUNTIME_PASSWORD=$runtime"
            echo "CHANGEDESK_WORKER_PASSWORD=$worker"
            echo "ATLAS_DB_PASSWORD=$atlas"
            echo "BOREAL_DB_PASSWORD=$boreal"
            echo "CHANGEDESK_POSTGRES_PORT=5432"
            echo "CHANGEDESK_INTEGRATION_DATABASE_SCOPE=$database"
            echo "CHANGEDESK_MIGRATOR_DATABASE_URL=postgresql://changedesk_migrator:$migrator@127.0.0.1:5432/$database"
            echo "CHANGEDESK_RUNTIME_DATABASE_URL=postgresql://changedesk_runtime:$runtime@127.0.0.1:5432/$database"
            echo "CHANGEDESK_WORKER_DATABASE_URL=postgresql://changedesk_worker:$worker@127.0.0.1:5432/$database"
            echo "ATLAS_DATABASE_URL=postgresql://atlas_owner:$atlas@127.0.0.1:5432/atlas"
          } >> "$GITHUB_ENV"
      - name: Start scoped PostgreSQL laboratory
        run: docker compose -p changedesk-ci-${{ github.run_id }} -f infra/compose.yaml up -d --wait postgres
      - name: Create the run-scoped integration database
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p changedesk-ci-${{ github.run_id }} -f infra/compose.yaml exec -T postgres \
            psql --set ON_ERROR_STOP=1 --username changedesk_bootstrap --dbname postgres \
            --command "CREATE DATABASE \"$CHANGEDESK_INTEGRATION_DATABASE_SCOPE\" OWNER changedesk_migrator"
          docker compose -p changedesk-ci-${{ github.run_id }} -f infra/compose.yaml exec -T postgres \
            psql --set ON_ERROR_STOP=1 --username changedesk_bootstrap --dbname postgres \
            --command "GRANT CONNECT ON DATABASE \"$CHANGEDESK_INTEGRATION_DATABASE_SCOPE\" TO changedesk_runtime, changedesk_worker"
      - name: Run PostgreSQL storage and runtime gates
        run: node scripts/verify-ci.mjs --lane postgres
      - name: Stop scoped PostgreSQL laboratory
        if: always()
        run: docker compose -p changedesk-ci-${{ github.run_id }} -f infra/compose.yaml down

  medusa-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure ephemeral Medusa database
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="$(openssl rand -hex 24)"
          migrator="$(openssl rand -hex 24)"
          runtime="$(openssl rand -hex 24)"
          worker="$(openssl rand -hex 24)"
          atlas="$(openssl rand -hex 24)"
          boreal="$(openssl rand -hex 24)"
          for secret in "$bootstrap" "$migrator" "$runtime" "$worker" "$atlas" "$boreal"; do echo "::add-mask::$secret"; done
          {
            echo "POSTGRES_BOOTSTRAP_PASSWORD=$bootstrap"
            echo "CHANGEDESK_MIGRATOR_PASSWORD=$migrator"
            echo "CHANGEDESK_RUNTIME_PASSWORD=$runtime"
            echo "CHANGEDESK_WORKER_PASSWORD=$worker"
            echo "ATLAS_DB_PASSWORD=$atlas"
            echo "BOREAL_DB_PASSWORD=$boreal"
            echo "CHANGEDESK_POSTGRES_PORT=5432"
            echo "DATABASE_URL=postgresql://atlas_owner:$atlas@127.0.0.1:5432/atlas"
          } >> "$GITHUB_ENV"
      - run: docker compose -p changedesk-medusa-ci-${{ github.run_id }} -f infra/compose.yaml up -d --wait postgres
      - name: Build Medusa plugin before the official runner
        run: node scripts/verify-ci.mjs --lane build
      - name: Run official Medusa integration runner
        run: node scripts/verify-ci.mjs --lane medusa
      - name: Stop scoped PostgreSQL laboratory
        if: always()
        run: docker compose -p changedesk-medusa-ci-${{ github.run_id }} -f infra/compose.yaml down
