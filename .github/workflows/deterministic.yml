name: deterministic

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-core-laws:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the untrusted revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the pinned package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.22.0
          run_install: false
      - name: Install the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run deterministic contract, core and law gates
        run: node scripts/verify-ci.mjs
